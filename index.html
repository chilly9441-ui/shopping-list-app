<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑리스트</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1><span aria-hidden="true">🛒 </span>쇼핑리스트</h1>

    <form id="add-form" class="add-form">
      <label for="item-input" class="sr-only">추가할 아이템</label>
      <input id="item-input" type="text" placeholder="예: 우유" maxlength="100" autocomplete="off" />
      <button type="submit">추가</button>
    </form>
    <p id="error" class="error" role="alert"></p>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty">아직 아이템이 없어요. 위에서 추가해 보세요.</p>

    <footer class="footer">
      <span id="count"></span>
      <button id="clear-done" type="button" class="link-btn">완료 항목 지우기</button>
    </footer>

    <!-- 화면에는 보이지 않고, 화면 읽기 프로그램이 변경 내용을 읽어 주는 영역 -->
    <div id="status" class="sr-only" role="status" aria-live="polite"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
